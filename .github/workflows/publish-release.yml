name: Publish Release

on:
  push:
    tags:
      - "manager-template-v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Build release archive
        run: |
          git archive --format=zip --output="${GITHUB_REF_NAME}.zip" HEAD
          sha256sum "${GITHUB_REF_NAME}.zip" > "${GITHUB_REF_NAME}.zip.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#manager-template-}"
          notes_file="RELEASE_NOTES_${version}.md"
          if [ -f "$notes_file" ]; then
            gh release create "$GITHUB_REF_NAME" \
              "${GITHUB_REF_NAME}.zip" \
              "${GITHUB_REF_NAME}.zip.sha256" \
              --title "Manager Research Workspace Template ${version}" \
              --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" \
              "${GITHUB_REF_NAME}.zip" \
              "${GITHUB_REF_NAME}.zip.sha256" \
              --title "Manager Research Workspace Template ${version}" \
              --generate-notes
          fi

  windows-exe:
    runs-on: windows-latest
    needs: publish
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Write build version
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".Replace("manager-template-v", "")
          @{
            version = $version
            distribution = "public"
            release_repo = "ErPurE/manager-research-workspace-template"
          } | ConvertTo-Json | Set-Content -Encoding UTF8 dashboard/version.json

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --name ManagerDashboard `
            --console `
            --icon dashboard/manager-dashboard-icon.ico `
            --add-data "dashboard/index.html;dashboard" `
            --add-data "dashboard/app.js;dashboard" `
            --add-data "dashboard/style.css;dashboard" `
            --add-data "dashboard/manager-dashboard-icon.ico;dashboard" `
            --add-data "dashboard/manager-dashboard-icon.png;dashboard" `
            --add-data "dashboard/version.json;dashboard" `
            --add-data ".agent;workspace_template/.agent" `
            --add-data "tasks;workspace_template/tasks" `
            --add-data "guidance;workspace_template/guidance" `
            --add-data "notes;workspace_template/notes" `
            --add-data "research;workspace_template/research" `
            --add-data "README.md;workspace_template" `
            --add-data "INSTALL.md;workspace_template" `
            --add-data "AGENTS.md;workspace_template" `
            --add-data "CLAUDE.md;workspace_template" `
            dashboard/launcher.py

      - name: Smoke test bundled server imports
        shell: pwsh
        run: python -m py_compile dashboard/server.py dashboard/launcher.py

      - name: Create Windows archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ManagerDashboard/* -DestinationPath ManagerDashboard-windows-x64.zip -Force
          $hash = (Get-FileHash ManagerDashboard-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ManagerDashboard-windows-x64.zip" | Set-Content -Encoding ASCII ManagerDashboard-windows-x64.zip.sha256

      - name: Upload Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload "${env:GITHUB_REF_NAME}" `
            ManagerDashboard-windows-x64.zip `
            ManagerDashboard-windows-x64.zip.sha256 `
            --clobber
